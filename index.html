<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>todo</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1117">
<style>
  :root {
    --bg: #0e1117; --panel: #161b24; --line: #232a38;
    --text: #e6e9f0; --dim: #7d8799; --accent: #4ade80;
    --accent-dim: #1d3a2a; --danger: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overscroll-behavior-y: contain;
  }
  #app { max-width: 640px; margin: 0 auto; padding: 10px 14px 90px; }
  header { display: flex; align-items: baseline; gap: 10px; padding: 8px 2px 12px; }
  header h1 { font-size: 22px; margin: 0; letter-spacing: .5px; }
  header .count { color: var(--dim); font-size: 14px; }
  #net { margin-left: auto; font-size: 12px; color: var(--dim); }
  #net.err { color: var(--danger); }

  #addrow {
    display: flex; gap: 8px; margin-bottom: 14px;
    position: sticky; top: env(safe-area-inset-top); z-index: 5;
    background: var(--bg); padding: 6px 0 10px;
  }
  #addbox {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; color: var(--text); font: inherit;
    padding: 13px 16px; outline: none; min-width: 0;
  }
  #addbox:focus { border-color: var(--accent); }
  #addbtn {
    background: var(--accent); color: #05240f; border: 0; border-radius: 14px;
    font: inherit; font-weight: 700; font-size: 24px; width: 54px;
    flex: none; cursor: pointer;
  }
  #addbtn:active { transform: scale(.94); }

  .todo {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 13px 12px 13px 14px; margin-bottom: 8px;
    transition: opacity .15s;
  }
  .todo .tick {
    flex: none; width: 28px; height: 28px; margin-top: 1px;
    border: 2px solid var(--dim); border-radius: 50%;
    background: none; cursor: pointer; position: relative;
  }
  .todo .tick:active { transform: scale(.88); }
  .todo.done .tick { border-color: var(--accent); background: var(--accent-dim); }
  .todo.done .tick::after {
    content: "✓"; color: var(--accent); font-size: 17px; font-weight: 800;
    position: absolute; inset: 0; display: grid; place-items: center;
  }
  .todo .txt { flex: 1; padding-top: 2px; word-break: break-word; }
  .todo.done .txt { color: var(--dim); text-decoration: line-through; }
  .todo .via { display: block; color: var(--dim); font-size: 11px; margin-top: 3px; }
  .todo .del {
    flex: none; background: none; border: 0; color: var(--dim);
    font-size: 18px; padding: 4px 8px; cursor: pointer; margin: -2px -4px 0 0;
  }
  .todo .del:active { color: var(--danger); }
  .todo .grab {
    flex: none; background: none; border: 0; color: var(--dim);
    font-size: 15px; padding: 4px 0; margin: 0 -6px 0 -4px;
    cursor: grab; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  .todo.drag {
    position: relative; z-index: 6; opacity: .93; transition: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.55); border-color: var(--accent);
  }
  body.dragging { -webkit-user-select: none; user-select: none; }

  #foot { text-align: center; padding: 26px 0 10px; }
  #foot button {
    background: none; border: 0; color: var(--dim); font: inherit;
    font-size: 13px; cursor: pointer; text-decoration: underline;
    text-underline-offset: 3px;
  }
  #skillview {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: rgba(5,8,12,.72);
    padding: calc(16px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom));
  }
  #skillview.show { display: flex; }
  #skillcard {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    width: 100%; max-width: 640px; margin: 0 auto;
    display: flex; flex-direction: column; min-height: 0;
  }
  #skilltext {
    flex: 1; overflow: auto; margin: 0; padding: 14px 16px;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word;
    -webkit-user-select: text; user-select: text;
  }
  #skillbtns { display: flex; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
  #skillcopy {
    flex: 1; background: var(--accent); color: #05240f; border: 0;
    border-radius: 12px; font: inherit; font-weight: 700; padding: 12px; cursor: pointer;
  }
  #skillclose {
    background: none; border: 1px solid var(--line); color: var(--dim);
    border-radius: 12px; font: inherit; padding: 12px 18px; cursor: pointer;
  }

  #donehead {
    display: flex; align-items: center; gap: 8px; margin: 20px 2px 10px;
    color: var(--dim); font-size: 14px; cursor: pointer; user-select: none;
  }
  #donehead .clear {
    margin-left: auto; background: none; border: 1px solid var(--line);
    color: var(--dim); border-radius: 10px; font: inherit; font-size: 13px;
    padding: 4px 12px; cursor: pointer;
  }
  #donelist.hidden { display: none; }
  #empty { color: var(--dim); text-align: center; padding: 40px 0 20px; }
  #lock { text-align: center; padding: 60px 14px; display: none; }
  #lock .bigbtn {
    background: var(--accent); color: #05240f; border: 0; border-radius: 16px;
    font: inherit; font-size: 19px; font-weight: 700; padding: 16px 28px;
    cursor: pointer; margin-top: 18px;
  }
  #lock .bigbtn:active { transform: scale(.96); }
  #lockmsg { color: var(--dim); }
  #lockerr { color: var(--danger); margin-top: 14px; min-height: 1.4em; }

  #toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%); background: #262e3d; color: var(--text);
    border-radius: 12px; padding: 11px 18px; display: none; z-index: 10;
    box-shadow: 0 6px 24px rgba(0,0,0,.5); font-size: 15px;
    align-items: center; gap: 14px; max-width: 90vw;
  }
  #toast.show { display: flex; }
  #toast button {
    background: none; border: 0; color: var(--accent); font: inherit;
    font-weight: 700; cursor: pointer; padding: 0;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>✅ todo</h1>
    <span class="count" id="count"></span>
    <span id="net"></span>
  </header>
  <div id="addrow">
    <input id="addbox" type="text" placeholder="add a todo…" autocomplete="off" enterkeyhint="done">
    <button id="addbtn" aria-label="add">+</button>
  </div>
  <div id="openlist"></div>
  <div id="empty" style="display:none">nothing to do 🎉</div>
  <div id="donehead" style="display:none">
    <span id="donetitle">done</span>
    <button class="clear" id="clearbtn">clear</button>
  </div>
  <div id="donelist"></div>
  <div id="foot"><button id="skilllink">🤖 agent instructions</button></div>
  <div id="lock">
    <div style="font-size:44px">🔒</div>
    <div id="lockmsg">locked</div>
    <button class="bigbtn" id="lockbtn">unlock</button>
    <div id="lockerr"></div>
  </div>
</div>
<div id="skillview">
  <div id="skillcard">
    <pre id="skilltext">loading…</pre>
    <div id="skillbtns">
      <button id="skillcopy">copy</button>
      <button id="skillclose">close</button>
    </div>
  </div>
</div>
<div id="toast"><span id="toastmsg"></span><button id="undobtn">undo</button></div>

<script>
"use strict";
const $ = id => document.getElementById(id);

// ---- token: ?t= once, then localStorage (so the installed PWA works) ----
// Auth: passkey (Face ID) -> 24h HttpOnly cookie. A bearer token in ?t= or
// localStorage still works for dev/testing, but phones never see one.
const qs = new URLSearchParams(location.search);
if (qs.get("t")) localStorage.setItem("todo_t", qs.get("t"));
const TOKEN = localStorage.getItem("todo_t") || "";
const ENROLL = qs.get("enroll") || "";

let todos = [];        // server truth (with optimistic edits applied)
let rev = -1;
let lastDeleted = null, toastTimer = null;

function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers);
  if (TOKEN) opts.headers["Authorization"] = "Bearer " + TOKEN;
  if (opts.body) opts.headers["Content-Type"] = "application/json";
  return fetch(path, opts).then(r => {
    if (r.status === 401) { showLock(); throw new Error("401"); }
    if (!r.ok) throw new Error("http " + r.status);
    $("net").textContent = ""; $("net").className = "";
    return r.json();
  }).catch(e => {
    if (e.message !== "401") { $("net").textContent = "offline"; $("net").className = "err"; }
    throw e;
  });
}

// ---- passkey lock screen ----------------------------------------------
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const ub64 = s => Uint8Array.from(
  atob(s.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - s.length % 4) % 4)),
  c => c.charCodeAt(0));

function showLock() {
  $("lock").style.display = "block";
  document.getElementById("addrow").style.display = "none";
  $("foot").style.display = "none";
  $("lockbtn").style.display = "";
  if (ENROLL) {
    $("lockmsg").textContent = "set up Face ID for this device";
    $("lockbtn").textContent = "➕ enroll Face ID";
    if (!window.PublicKeyCredential) {
      // Telegram/in-app browsers have no WebAuthn — a dead button with a
      // cryptic error reads as "broken", so say the actual fix.
      $("lockbtn").style.display = "none";
      $("lockerr").textContent =
        "this browser can't do Face ID — copy this link and open it in Safari";
    }
  } else {
    $("lockmsg").textContent = "face scan to open (once a day)";
    $("lockbtn").textContent = "🔓 unlock";
  }
}
function hideLock() {
  $("lock").style.display = "none";
  document.getElementById("addrow").style.display = "flex";
  $("foot").style.display = "";
  $("lockerr").textContent = "";
}

async function pjson(path, body) {
  const r = await fetch(path, { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ("http " + r.status));
  return d;
}

async function doEnroll() {
  const c = await pjson("/auth/challenge", { purpose: "register", code: ENROLL });
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: ub64(c.challenge),
    rp: { id: c.rpId, name: "todo" },
    user: { id: crypto.getRandomValues(new Uint8Array(16)),
            name: "austin", displayName: "austin" },
    pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
    authenticatorSelection: { residentKey: "preferred", userVerification: "required" },
    timeout: 60000 } });
  await pjson("/auth/register", {
    code: ENROLL, id: cred.id,
    spki: btoa(String.fromCharCode(...new Uint8Array(cred.response.getPublicKey()))),
    alg: cred.response.getPublicKeyAlgorithm(),
    clientDataJSON: b64u(cred.response.clientDataJSON),
    authenticatorData: b64u(cred.response.getAuthenticatorData()),
    label: navigator.platform || "" });
  history.replaceState(null, "", "/");
}

async function doLogin() {
  const c = await pjson("/auth/challenge", { purpose: "login" });
  const cred = await navigator.credentials.get({ publicKey: {
    challenge: ub64(c.challenge), rpId: c.rpId, userVerification: "required",
    allowCredentials: (c.credIds || []).map(id =>
      ({ type: "public-key", id: ub64(id), transports: ["internal"] })),
    timeout: 60000 } });
  await pjson("/auth/login", {
    id: cred.id,
    clientDataJSON: b64u(cred.response.clientDataJSON),
    authenticatorData: b64u(cred.response.authenticatorData),
    signature: b64u(cred.response.signature) });
}

$("lockbtn").onclick = async () => {
  $("lockerr").textContent = "";
  try {
    await (ENROLL ? doEnroll() : doLogin());
    hideLock(); rev = -1; refresh();
  } catch (e) {
    $("lockerr").textContent =
      (e.name === "NotSupportedError" || e instanceof TypeError)
        ? "this browser can't do Face ID — open this link in Safari"
        : (e.message || "failed");
  }
};

function render() {
  const open = todos.filter(t => !t.done);
  const done = todos.filter(t => t.done);
  $("count").textContent = open.length ? open.length + " open" : "";
  $("empty").style.display = (open.length || done.length) ? "none" : "block";
  $("donehead").style.display = done.length ? "flex" : "none";
  $("donetitle").textContent = "done (" + done.length + ")";
  fill($("openlist"), open);
  fill($("donelist"), done);
}

function fill(el, list) {
  el.textContent = "";
  for (const t of list) {
    const row = document.createElement("div");
    row.className = "todo" + (t.done ? " done" : "");
    row.dataset.id = t.id;
    if (!t.done) {
      const grab = document.createElement("button");
      grab.className = "grab"; grab.textContent = "⠿";
      grab.setAttribute("aria-label", "drag to reorder");
      grab.addEventListener("pointerdown", e => startDrag(e, row));
      row.appendChild(grab);
    }
    const tick = document.createElement("button");
    tick.className = "tick"; tick.setAttribute("aria-label", t.done ? "reopen" : "complete");
    tick.onclick = () => toggle(t);
    const txt = document.createElement("div");
    txt.className = "txt"; txt.textContent = t.text;
    if (t.via && t.via !== "web") {
      const via = document.createElement("span");
      via.className = "via"; via.textContent = "via " + t.via;
      txt.appendChild(via);
    }
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "✕"; del.setAttribute("aria-label", "delete");
    del.onclick = () => remove(t);
    row.append(tick, txt, del);
    el.appendChild(row);
  }
}

function refresh() {
  if (dragging) return; // a poll repaint mid-drag would yank the row away
  api("/api/todos").then(d => {
    hideLock();
    if (dragging) return;
    if (d.rev !== rev) { rev = d.rev; todos = d.todos; render(); }
  }).catch(() => {});
}

// ---- drag to reorder (open list only) ----------------------------------
let dragging = false;

function startDrag(e, row) {
  const list = $("openlist");
  if (e.button || row.parentNode !== list || dragging) return;
  e.preventDefault();
  dragging = true;
  document.body.classList.add("dragging");
  row.classList.add("drag");
  const handle = e.currentTarget;
  try { handle.setPointerCapture(e.pointerId); } catch (_) {}
  const GAP = 8; // .todo margin-bottom
  let y0 = e.clientY, dy = 0;
  const place = () => { row.style.transform = "translateY(" + dy + "px)"; };

  const move = ev => {
    dy += ev.clientY - y0; y0 = ev.clientY; place();
    // swap with a neighbour once our centre crosses its midpoint; the DOM
    // move shifts our static position, so fold the neighbour's height back
    // into dy to keep the row visually pinned to the finger
    for (;;) {
      const r = row.getBoundingClientRect(), mid = r.top + r.height / 2;
      const prev = row.previousElementSibling, next = row.nextElementSibling;
      if (prev) {
        const pr = prev.getBoundingClientRect();
        if (mid < pr.top + pr.height / 2) {
          list.insertBefore(row, prev); dy += pr.height + GAP; place(); continue;
        }
      }
      if (next) {
        const nr = next.getBoundingClientRect();
        if (mid > nr.top + nr.height / 2) {
          list.insertBefore(next, row); dy -= nr.height + GAP; place(); continue;
        }
      }
      break;
    }
  };

  const finish = commit => {
    handle.removeEventListener("pointermove", move);
    handle.removeEventListener("pointerup", up);
    handle.removeEventListener("pointercancel", cancel);
    row.classList.remove("drag");
    row.style.transform = "";
    document.body.classList.remove("dragging");
    dragging = false;
    if (commit) commitOrder(); else render();
  };
  const up = () => finish(true);
  const cancel = () => finish(false);
  handle.addEventListener("pointermove", move);
  handle.addEventListener("pointerup", up);
  handle.addEventListener("pointercancel", cancel);
}

function commitOrder() {
  const ids = Array.from($("openlist").children).map(r => r.dataset.id);
  const pos = new Map(ids.map((id, i) => [id, i]));
  const open = todos.filter(t => !t.done)
    .sort((a, b) => (pos.get(a.id) ?? 0) - (pos.get(b.id) ?? 0));
  todos = open.concat(todos.filter(t => t.done));
  render();
  api("/api/reorder", { method: "POST", body: JSON.stringify({ ids }) })
    .then(d => { rev = d.rev; })
    .catch(() => {});
}

function add() {
  const text = $("addbox").value.trim();
  if (!text) return;
  $("addbox").value = "";
  $("addbox").focus();
  const fake = { id: "pending" + Math.random(), text, done: false, via: "web" };
  todos.unshift(fake); render();
  api("/api/todos", { method: "POST", body: JSON.stringify({ text, via: "web" }) })
    .then(t => { Object.assign(fake, t); })
    .catch(() => { todos = todos.filter(x => x !== fake); render(); });
}

function toggle(t) {
  t.done = !t.done; render();
  api("/api/todos/" + t.id, { method: "POST", body: JSON.stringify({ done: t.done }) })
    .catch(() => { t.done = !t.done; render(); });
}

function remove(t) {
  todos = todos.filter(x => x !== t); render();
  api("/api/todos/" + t.id, { method: "DELETE" })
    .then(() => showUndo(t))
    .catch(() => { todos.push(t); render(); });
}

function showUndo(t) {
  lastDeleted = t;
  $("toastmsg").textContent = "deleted “" + (t.text.length > 30 ? t.text.slice(0, 30) + "…" : t.text) + "”";
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 6000);
}

$("undobtn").onclick = () => {
  $("toast").classList.remove("show");
  if (!lastDeleted) return;
  const t = lastDeleted; lastDeleted = null;
  api("/api/todos", { method: "POST", body: JSON.stringify({ text: t.text, via: t.via || "web" }) })
    .then(() => refresh()).catch(() => {});
};

$("clearbtn").onclick = e => {
  e.stopPropagation();
  api("/api/clear_done", { method: "POST" }).then(() => refresh()).catch(() => {});
};
$("donehead").onclick = () => $("donelist").classList.toggle("hidden");

// ---- 🤖 agent instructions (generated server-side, embeds the token) ----
$("skilllink").onclick = async () => {
  $("skillview").classList.add("show");
  $("skilltext").textContent = "loading…";
  try {
    const r = await fetch("/skill.md",
      { headers: TOKEN ? { Authorization: "Bearer " + TOKEN } : {} });
    if (r.status === 401) { $("skillview").classList.remove("show"); showLock(); return; }
    $("skilltext").textContent = await r.text();
  } catch (e) {
    $("skilltext").textContent = "failed to load: " + (e.message || e);
  }
};
$("skillclose").onclick = () => $("skillview").classList.remove("show");
$("skillview").onclick = e => {
  if (e.target === $("skillview")) $("skillview").classList.remove("show");
};
$("skillcopy").onclick = async () => {
  try {
    await navigator.clipboard.writeText($("skilltext").textContent);
    $("skillcopy").textContent = "copied ✓";
  } catch (_) {
    // clipboard can be denied — select the text so a manual copy is one tap
    const sel = getSelection(), range = document.createRange();
    range.selectNodeContents($("skilltext"));
    sel.removeAllRanges(); sel.addRange(range);
    $("skillcopy").textContent = "denied — text selected, copy by hand";
  }
  setTimeout(() => { $("skillcopy").textContent = "copy"; }, 1800);
};
$("addbtn").onclick = add;
$("addbox").addEventListener("keydown", e => { if (e.key === "Enter") add(); });

document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
setInterval(() => { if (!document.hidden) refresh(); }, 4000);
// An enroll link must ALWAYS land on the enroll screen. The lock otherwise
// only appears on a 401, so a browser that still holds a working token or
// session cookie would swallow the ?enroll code and open the app instead.
if (ENROLL) showLock(); else refresh();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
